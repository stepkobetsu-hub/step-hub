<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6b49e0">
<title>フォレスタプラス | STEP塾生アプリ</title>
<link rel="icon" href="step-logo.svg" type="image/svg+xml">
<style>
*{box-sizing:border-box}html{background:#eef7ff}body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif;color:#20334d;background:linear-gradient(160deg,#dff6ff,#f6f1ff 55%,#edfff2)}.app{width:min(100% - 28px,560px);margin:auto;padding:calc(18px + env(safe-area-inset-top)) 0 calc(30px + env(safe-area-inset-bottom))}.top{display:flex;align-items:center;margin-bottom:14px}.back{color:#123d73;text-decoration:none;font-weight:900}.brand{margin-left:auto;color:#687a92;font-size:12px;font-weight:800}.card{background:rgba(255,255,255,.97);border:2px solid #fff;border-radius:28px;padding:24px;box-shadow:0 18px 42px rgba(62,73,130,.15);text-align:center}.play{width:76px;height:76px;margin:auto;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#a28cf6,#6b49e0);color:#fff;font-size:34px;box-shadow:0 10px 24px rgba(107,73,224,.28)}h1{margin:15px 0 7px;font-size:25px;color:#4e31ba}p{margin:0;color:#687a92;line-height:1.7}.login{display:grid;place-items:center;width:100%;min-height:54px;margin:20px 0 0;border-radius:16px;background:linear-gradient(135deg,#7453e9,#5e3ccd);color:#fff;text-decoration:none;font-weight:900;box-shadow:0 9px 22px rgba(107,73,224,.22)}.guide{margin-top:18px;padding-top:20px;border-top:2px dashed #dfd8f7}.guide h2{margin:0;color:#20334d;font-size:19px}.juku{display:inline-flex;align-items:center;gap:8px;margin:13px 0;padding:9px 18px;border-radius:999px;background:#f1edff;color:#5738c6;font-weight:900}.juku b{font-size:22px}.qr{display:block;width:220px;height:220px;max-width:100%;margin:4px auto 10px;padding:10px;border:1px solid #dedbea;border-radius:18px;background:#fff}.url{display:block;margin:auto;padding:10px;border-radius:12px;background:#f7f9fc;color:#476079;font-size:11px;line-height:1.55;overflow-wrap:anywhere}.hint{margin-top:12px;font-size:12px}.foot{margin-top:16px;color:#8291a1;font-size:11px}
</style>
</head>
<body>
<main class="app">
<div class="top"><a class="back" href="./">← STEP塾生アプリに戻る</a><span class="brand">個別指導STEP</span></div>
<section class="card">
<div class="play" aria-hidden="true">▶</div>
<h1>フォレスタプラス</h1>
<p>映像授業のログイン画面を開きます。</p>
<a class="login" href="https://forestaplus.com/student/auth/login">フォレスタプラスにログイン</a>
<div class="guide">
<div class="juku">塾ID <b>124</b></div>
<h2>タブレットなどで見る場合</h2>
<p>下のQRコードを別の端末で読み取ってください。</p>
<img class="qr" src="https://api.qrserver.com/v1/create-qr-code/?size=440x440&amp;margin=12&amp;data=https%3A%2F%2Fforestaplus.com%2Fstudent%2Fauth%2Flogin" alt="フォレスタプラス ログインページのQRコード" width="220" height="220">
<span class="url">https://forestaplus.com/student/auth/login</span>
<p class="hint">読み取り後、ログイン画面で塾ID「124」を入力してください。</p>
</div>
</section>
<div class="foot">パスワードはこの画面には保存されません。</div>
</main>
</body>
</html>
